<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Examen con Candados</title>
  <style>
    .opcion {
      margin: 10px 0;
    }
    button {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h3>Pregunta: Este que ves, engaño colorido...</h3>
  <p>El texto subrayado se identifica como:</p>

  <form id="examen">
    Nombre: <input type="text" name="nombre" required><br><br>

    <div class="opcion">
      <button type="button" onclick="seleccionar('Metáfora')">Opción A 🔒</button>
    </div>
    <div class="opcion">
      <button type="button" onclick="seleccionar('Alegoría')">Opción B 🔒</button>
    </div>
    <div class="opcion">
      <button type="button" onclick="seleccionar('Hipérbole')">Opción C 🔒</button>
    </div>
    <div class="opcion">
      <button type="button" onclick="seleccionar('Símil')">Opción D 🔒</button>
    </div>

    <input type="hidden" name="respuesta" id="respuesta">
    <br>
    <button type="button" onclick="enviar()">Enviar</button>
  </form>

  <script>
    function seleccionar(opcion) {
      // Guardar la opción elegida en el campo oculto
      document.getElementById("respuesta").value = opcion;
      alert("Has seleccionado: " + opcion);
    }

    function enviar() {
      const form = document.getElementById("examen");
      const datos = {
        nombre: form.nombre.value,
        respuesta: form.respuesta.value
      };

      if (!datos.respuesta) {
        alert("Primero selecciona una opción con candado.");
        return;
      }

      // 👉 Reemplaza esta URL con la de tu Apps Script
      const url = "https://script.google.com/macros/s/AKfycbyq-zkcSOtbK7JXTCs6F2oAYDlX-XGLHAOwS8OXuAWDX0bOwP4Kx7-hpYEagR3b93bS/exec";

      fetch(url, {
        method: "POST",
        body: JSON.stringify(datos)
      })
      .then(res => res.text())
      .then(msg => alert("Respuestas enviadas: " + msg))
      .catch(err => alert("Error al enviar: " + err));
    }
  </script>
</body>
</html>
