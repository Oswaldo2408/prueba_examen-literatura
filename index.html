<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Examen con Candados</title>
  <style>
    .opcion {
      margin: 10px 0;
    }
    button {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Examen de Literatura</h2>

  <form id="examen">
    Nombre: <input type="text" name="nombre" required><br><br>

    <h3>Pregunta: Este que ves, engaño colorido...</h3>
    <p>El texto subrayado se identifica como:</p>

    <div class="opcion">
      <button onclick="mostrarRespuesta(this, 'Metáfora')">Opción A 🔒</button>
    </div>
    <div class="opcion">
      <button onclick="mostrarRespuesta(this, 'Alegoría')">Opción B 🔒</button>
    </div>
    <div class="opcion">
      <button onclick="mostrarRespuesta(this, 'Hipérbole')">Opción C 🔒</button>
    </div>
    <div class="opcion">
      <button onclick="mostrarRespuesta(this, 'Símil')">Opción D 🔒</button>
    </div>

    <!-- Campo oculto donde se guarda la opción elegida -->
    <input type="hidden" name="respuesta" id="respuesta">

    <br>
    <button type="button" onclick="enviar()">Enviar</button>
  </form>

  <script>
    function mostrarRespuesta(boton, texto) {
      // Restaurar todos los botones a su estado original
      const botones = document.querySelectorAll('.opcion button');
      botones.forEach(b => {
        b.innerText = b.getAttribute('data-original') || b.innerText;
      });

      // Guardar el texto original si no está guardado
      if (!boton.getAttribute('data-original')) {
        boton.setAttribute('data-original', boton.innerText);
      }

      // Cambiar el botón presionado por la respuesta
      boton.innerText = texto;

      // Guardar la respuesta en el campo oculto
      document.getElementById("respuesta").value = texto;
    }

    function enviar() {
      const form = document.getElementById("examen");
      const datos = {
        nombre: form.nombre.value,
        respuesta: form.respuesta.value
      };

      if (!datos.respuesta) {
        alert("Primero selecciona una opción con candado.");
        return;
      }

      // 👉 Reemplaza esta URL con la de tu Apps Script
      const url = "TU_URL_DEL_SCRIPT";

      fetch(url, {
        method: "POST",
        body: JSON.stringify(datos)
      })
      .then(res => res.text())
      .then(msg => alert("Respuestas enviadas: " + msg))
      .catch(err => alert("Error al enviar: " + err));
    }
  </script>
</body>
</html>
