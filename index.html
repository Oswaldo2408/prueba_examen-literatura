<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Examen Interactivo</title>
</head>
<body>
  <h2>Examen de Prueba</h2>

  <form id="examen">
    <label>Nombre:</label><br>
    <input type="text" name="nombre" required><br><br>

    <label>Pregunta 1: ¿Cuál es la capital de México?</label><br>
    <input type="text" name="respuesta1" required><br><br>

    <label>Pregunta 2: ¿Quién escribió Don Quijote?</label><br>
    <input type="text" name="respuesta2" required><br><br>

    <button type="button" onclick="enviar()">Enviar</button>
  </form>

  <script>
    function enviar() {
      const form = document.getElementById("examen");
      const datos = {
        nombre: form.nombre.value,
        respuesta1: form.respuesta1.value,
        respuesta2: form.respuesta2.value
      };

      // 👉 Reemplaza esta URL con la de tu Apps Script
      const url = "https://script.google.com/macros/s/AKfycbyq-zkcSOtbK7JXTCs6F2oAYDlX-XGLHAOwS8OXuAWDX0bOwP4Kx7-hpYEagR3b93bS/exec";

      fetch(url, {
        method: "POST",
        body: JSON.stringify(datos)
      })
      .then(res => res.text())
      .then(msg => alert("Respuestas enviadas: " + msg))
      .catch(err => alert("Error al enviar: " + err));
    }
  </script>
</body>
</html>
